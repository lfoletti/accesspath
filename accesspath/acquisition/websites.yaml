# Savoir des collecteurs de sites, vue publique (voir accesspath/acquisition/patterns.py).
# Aucun site nommé : chaque motif dit combien de sites le portent ; seuls les motifs partagés restent.
version: 1
generated: '2026-10-25'
cms_profiles:
  wordpress:
    body_scope: .entry-content, article.post, article, main
    lazy_attrs:
    - data-src
    - data-lazy-src
    - data-hw-src
    - src
    image_allow_substrings:
    - /wp-content/uploads/
    - /app/uploads/
    image_canonical_strip_patterns:
    - regex: -\d+x\d+(?:-c-[a-z]+)?(?=\.[a-z]+(?:[?#]|$))
      flags: i
    project_path_patterns:
    - regex: ^/(?:[a-z]{2}/)?(?:project|projects|projet|projets|projekt|projekte|progetto|progetti|realisation|realisations|portfolio|portfolio_page|work|works|werk|werke|oeuvre|oeuvres|references|referenzen|bauten)/[^/]+/?$
      flags: i
  drupal:
    body_scope: main, article, .field--name-body, .node__content
    lazy_attrs:
    - data-src
    - src
    image_allow_substrings:
    - /sites/default/files/
    - /sites/all/files/
    - /files/
    image_canonical_strip_patterns:
    - regex: /styles/[^/]+/public/
      flags: i
    project_path_patterns:
    - regex: ^/(?:[a-z]{2}/)?(?:project|projects|projekt|projekte|referenzen|references|realisations|portfolio)/[^/]+/?$
      flags: i
  imaginator:
    body_scope: '#content'
    lazy_attrs:
    - src
    image_allow_substrings:
    - opere_images/
    - proj_images/
    - /images/
    image_canonical_strip_patterns: []
    project_path_patterns: []
  typo3:
    body_scope: 'main, article, .frame-default, #c1'
    lazy_attrs:
    - data-src
    - src
    image_allow_substrings:
    - /fileadmin/
    - /typo3conf/
    - /uploads/
    - /_processed_/
    image_canonical_strip_patterns: []
    project_path_patterns:
    - regex: ^/(?:[a-z]{2}/)?(?:project|projekt|projekte|referenzen|references)/[^/]+/?$
      flags: i
  django_filer:
    body_scope: .content, main, article
    lazy_attrs:
    - data-src
    - src
    image_allow_substrings:
    - /media/filer_public/
    - /media/filer_public_thumbnails/
    - /media/uploads/
    image_canonical_strip_patterns:
    - regex: /filer_public_thumbnails/filer_public/
      flags: i
    - regex: __[a-f0-9]{6,}\.[0-9]+x[0-9]+(?:_[a-z0-9]+)?(?=\.[a-z]+(?:[?#]|$))
      flags: i
    project_path_patterns: []
  squarespace:
    body_scope: article, main, .sqs-block-content, .content
    lazy_attrs:
    - data-src
    - data-image
    - src
    image_allow_substrings:
    - squarespace-cdn.com
    - static1.squarespace.com
    - static.squarespace.com
    image_canonical_strip_patterns:
    - regex: \?format=[^&#\"']+
      flags: i
    - regex: '&(?:dpr|width|height)=[^&#\"'']+'
      flags: i
    project_path_patterns: []
